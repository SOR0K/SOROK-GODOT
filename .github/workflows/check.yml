name: 고도 자동 점검
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 고도 4.7.2 받기
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O g.zip
          unzip -q g.zip && mv Godot_v4.7.2-stable_linux.x86_64 godot && chmod +x godot
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1 fonts-noto-cjk > /dev/null
      - name: 가져오기
        run: timeout 120 ./godot --headless --path . --import 2>&1 | tail -20 || true
      - name: 자동 테스트 + 스크린샷
        run: |
          mkdir -p shots
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" ./godot --path . --rendering-driver opengl3 --resolution 1280x720 -- --selftest 2>&1 | tee log.txt || true
          mkdir -p shots_pc && mv shots/* shots_pc/ 2>/dev/null || true
          timeout 180 xvfb-run -a -s "-screen 0 1600x720x24" ./godot --path . --rendering-driver opengl3 --resolution 1600x720 -- --selftest --touchui 2>&1 | tee log_touch.txt || true
          mkdir -p shots_touch && mv shots/* shots_touch/ 2>/dev/null || true
          echo "----- 에러 -----"
          grep -E "ERROR|SCRIPT ERROR|Parse Error|Invalid" log.txt log_touch.txt || echo "에러 없음"
      - name: 결과를 ci-results 가지에 올리기
        run: |
          mkdir -p out && cp log*.txt out/ && cp -r shots_pc shots_touch out/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b ci-results
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "결과 ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results
